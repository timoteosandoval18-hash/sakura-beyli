<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura BEYLI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff69b4;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
        }
        #info {
            position: absolute;
            top: 10px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div id="info">Cargando animación...</div>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ANCHO = 1280, ALTO = 720;
canvas.width = ANCHO;
canvas.height = ALTO;

// Colores
const NARANJA_CIELO = 'rgb(255, 140, 60)';
const ROSA_ATARDECER = 'rgb(255, 100, 150)';
const MORADO_ATARDECER = 'rgb(80, 30, 100)';
const AMARILLO_SOL = 'rgb(255, 220, 100)';
const ROSA_SAKURA = 'rgb(255, 182, 193)';
const ROSA_OSCURO = 'rgb(255, 105, 180)';
const ROSA_CLARO = 'rgb(255, 220, 220)';
const BLANCO = 'rgb(255, 255, 255)';
const CAFE_TRONCO = 'rgb(110, 70, 35)';
const CAFE_OSCURO = 'rgb(80, 50, 25)';
const CAFE_RAMA = 'rgb(130, 85, 40)';
const VERDE_CESPED = 'rgb(60, 160, 50)';
const VERDE_OSCURO = 'rgb(40, 110, 30)';
const VERDE_CLARO = 'rgb(90, 200, 70)';

let tiempoInicio = Date.now();
let petalos = [];
let estrellas = [];
let flores = [];

const tronco_x = ANCHO - 350;
const tronco_y = ALTO - 80;

class Estrella {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.brillo_base = Math.floor(Math.random() * 75) + 180;
        this.vel = Math.random() * 0.03 + 0.03;
        this.offset = Math.random() * Math.PI * 2;
    }
    dibujar(t) {
        let brillo = this.brillo_base + Math.floor(60 * Math.sin(t * this.vel + this.offset));
        brillo = Math.max(150, Math.min(255, brillo));
        ctx.fillStyle = `rgb(${brillo}, ${brillo}, 255)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1, 0, Math.PI * 2);
        ctx.fill();
        if (brillo > 230) {
            ctx.strokeStyle = BLANCO;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(this.x - 3, this.y);
            ctx.lineTo(this.x + 3, this.y);
            ctx.moveTo(this.x, this.y - 3);
            ctx.lineTo(this.x, this.y + 3);
            ctx.stroke();
        }
    }
}

class Petalo {
    constructor(x, y, especial = false, objetivo = null, formando_nombre = false) {
        this.x = x;
        this.y = y;
        this.vel_y = especial? Math.random() * 2 + 2 : Math.random() * 1.5 + 1;
        this.vel_x = Math.random() * 3 - 1.5;
        this.tam = especial? Math.floor(Math.random() * 4) + 5 : Math.floor(Math.random() * 4) + 3;
        this.color = [ROSA_SAKURA, ROSA_OSCURO, ROSA_CLARO][Math.floor(Math.random() * 3)];
        this.especial = especial;
        this.objetivo = objetivo;
        this.llego = false;
        this.formando_nombre = formando_nombre;
        this.vel_formacion = 0.15;
    }
    mover() {
        if (this.objetivo &&!this.llego) {
            let dx = this.objetivo[0] - this.x;
            let dy = this.objetivo[1] - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist < 3) {
                this.llego = true;
                this.x = this.objetivo[0];
                this.y = this.objetivo[1];
            } else {
                this.x += dx * this.vel_formacion;
                this.y += dy * this.vel_formacion;
            }
        } else if (!this.llego) {
            this.y += this.vel_y;
            this.x += this.vel_x + Math.sin(this.y * 0.01);
        }
    }
    dibujar() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.tam, this.tam * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        if (this.llego) {
            let brillo = 150 + Math.floor(105 * Math.sin(Date.now() * 0.005));
            ctx.fillStyle = `rgb(255, ${brillo}, ${brillo})`;
            ctx.beginPath();
            ctx.arc(this.x + this.tam, this.y + this.tam/2, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

class FlorSakura {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.offset = Math.random() * Math.PI * 2;
        this.tam = Math.floor(Math.random() * 4) + 4;
        this.color = [ROSA_SAKURA, ROSA_OSCURO, ROSA_CLARO][Math.floor(Math.random() * 3)];
    }
    dibujar(t) {
        let balanceo = 1.5 * Math.sin(t * 0.001 + this.offset);
        let x = this.x + balanceo;
        for (let i = 0; i < 5; i++) {
            let ang = i * 72 * Math.PI / 180;
            let px = x + Math.cos(ang) * this.tam;
            let py = this.y + Math.sin(ang) * this.tam;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(px, py, this.tam, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = ROSA_OSCURO;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.fillStyle = AMARILLO_SOL;
        ctx.beginPath();
        ctx.arc(x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function dibujarAtardecer() {
    for (let y = 0; y < ALTO; y++) {
        let r, g, b;
        if (y < 240) {
            let ratio = y / 240;
            r = Math.floor(80 + (255 - 80) * ratio);
            g = Math.floor(30 + (100 - 30) * ratio);
            b = Math.floor(100 + (150 - 100) * ratio);
        } else if (y < 480) {
            let ratio = (y - 240) / 240;
            r = Math.floor(255 + (255 - 255) * ratio);
            g = Math.floor(100 + (140 - 100) * ratio);
            b = Math.floor(150 + (60 - 150) * ratio);
        } else {
            r = 255; g = 140; b = 60;
        }
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.fillRect(0, y, ANCHO, 1);
    }
    ctx.fillStyle = AMARILLO_SOL;
    ctx.beginPath();
    ctx.arc(ANCHO - 150, 130, 40, 0, Math.PI * 2);
    ctx.fill();
}

function dibujarArbol(x, y) {
    let offset_base = -20;
    ctx.fillStyle = CAFE_TRONCO;
    ctx.beginPath();
    ctx.moveTo(x - 20 + offset_base, y);
    ctx.lineTo(x - 25 + offset_base/2, y - 30);
    ctx.lineTo(x - 22 + offset_base/3, y - 60);
    ctx.lineTo(x - 18, y - 90);
    ctx.lineTo(x - 14, y - 120);
    ctx.lineTo(x - 10, y - 150);
    ctx.lineTo(x - 8, y - 180);
    ctx.lineTo(x + 8, y - 180);
    ctx.lineTo(x + 10, y - 150);
    ctx.lineTo(x + 14, y - 120);
    ctx.lineTo(x + 18, y - 90);
    ctx.lineTo(x + 22 + offset_base/3, y - 60);
    ctx.lineTo(x + 25 + offset_base/2, y - 30);
    ctx.lineTo(x + 20 + offset_base, y);
    ctx.closePath();
    ctx.fill();

    let ramas = [
        [x - 8, y - 170, x - 110, y - 240, 5],
        [x - 6, y - 155, x - 80, y - 210, 4],
        [x - 4, y - 140, x - 55, y - 185, 3],
        [x + 8, y - 165, x + 115, y - 235, 5],
        [x + 6, y - 150, x + 85, y - 205, 4],
        [x + 4, y - 135, x + 60, y - 180, 3],
        [x, y - 180, x - 30, y - 250, 4],
        [x, y - 175, x + 35, y - 245, 4]
    ];
    ctx.strokeStyle = CAFE_RAMA;
    ramas.forEach(([x1, y1, x2, y2, grosor]) => {
        ctx.lineWidth = grosor;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    });
}

function dibujarCesped(t) {
    ctx.fillStyle = VERDE_OSCURO;
    ctx.fillRect(0, ALTO - 80, ANCHO, 80);
    for (let i = 0; i < ANCHO; i += 2) {
        let altura_base = 14 + Math.floor(Math.random() * 10);
        let balanceo = 7 * Math.sin(t * 0.003 + i * 0.05);
        let altura = altura_base + balanceo;
        ctx.strokeStyle = [VERDE_CESPED, VERDE_CLARO, VERDE_OSCURO][Math.floor(Math.random() * 3)];
        ctx.lineWidth = Math.random() > 0.8? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(i, ALTO - 80);
        ctx.lineTo(i + balanceo * 0.4, ALTO - 80 - altura);
        ctx.stroke();
    }
}

function obtenerPuntosTexto(texto, x_centro, y_centro) {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = ANCHO;
    tempCanvas.height = ALTO;
    tempCtx.font = 'bold 80px Arial';
    tempCtx.fillStyle = 'white';
    tempCtx.textAlign = 'center';
    tempCtx.textBaseline = 'middle';
    tempCtx.fillText(texto, x_centro, y_centro);

    let puntos = [];
    let imgData = tempCtx.getImageData(0, 0, ANCHO, ALTO);
    for (let y = 0; y < ALTO; y += 4) {
        for (let x = 0; x < ANCHO; x += 4) {
            let idx = (y * ANCHO + x) * 4 + 3;
            if (imgData.data[idx] > 0) puntos.push([x, y]);
        }
    }
    return puntos;
}

function obtenerPuntosCorazon(x_centro, y_centro, escala = 1.0) {
    let puntos = [];
    for (let t = 0; t < 628; t += 3) {
        let t_rad = t / 100;
        let x = 16 * Math.pow(Math.sin(t_rad), 3);
        let y = 13 * Math.cos(t_rad) - 5 * Math.cos(2*t_rad) - 2 * Math.cos(3*t_rad) - Math.cos(4*t_rad);
        puntos.push([x_centro + x * escala, y_centro - y * escala]);
    }
    return puntos;
}

function obtenerEstadoActual() {
    const frases = [
        {duracion: 12, especial: false, nombre: false, pre_nombre: false},
        {duracion: 8, especial: false, nombre: false, pre_nombre: false},
        {duracion: 8, especial: false, nombre: false, pre_nombre: false},
        {duracion: 9, especial: false, nombre: false, pre_nombre: false},
        {duracion: 5, especial: false, nombre: false, pre_nombre: false},
        {duracion: 4, especial: true, nombre: false, pre_nombre: true},
        {duracion: 7, especial: false, nombre: true, pre_nombre: false}
    ];
    let tiempo_total = (Date.now() - tiempoInicio) / 1000;
    let duracion_total = frases.reduce((sum, f) => sum + f.duracion, 0);
    let tiempo_ciclo = tiempo_total % duracion_total;
    let tiempo_acumulado = 0;
    for (let frase of frases) {
        tiempo_acumulado += frase.duracion;
        if (tiempo_ciclo < tiempo_acumulado) {
            return [frase, tiempo_ciclo - (tiempo_acumulado - frase.duracion)];
        }
    }
    return [frases[0], 0];
}

function dibujarTextos() {
    let ahora = new Date();
    let diaDelAno = Math.floor((ahora - new Date(ahora.getFullYear(), 0, 0)) / 86400000);
    let horaStr = `${diaDelAno}/${ahora.toLocaleTimeString('es-MX')}`;

    ctx.font = 'bold 48px Consolas';
    ctx.fillStyle = 'rgb(20, 15, 30)';
    ctx.fillText(horaStr, 42, 42);
    ctx.fillStyle = BLANCO;
    ctx.fillText(horaStr, 40, 40);

    let [estado, tiempo_en_frase] = obtenerEstadoActual();

    if (estado.nombre || estado.pre_nombre) {
        let cx = ANCHO/2, cy = ALTO/2 - 20;
        let puntosNombre = obtenerPuntosTexto("beyli", cx, cy + 10);
        let puntosCorazon = obtenerPuntosCorazon(cx, cy, 13);
        let todosPuntos = puntosNombre.concat(puntosCorazon);
        let petalosNombre = petalos.filter(p => p.formando_nombre);

        if (petalosNombre.length < todosPuntos.length) {
            for (let i = 0; i < Math.min(20, todosPuntos.length - petalosNombre.length); i++) {
                let idx = petalosNombre.length + i;
                if (idx < todosPuntos.length) {
                    let flor_random = flores[Math.floor(Math.random() * flores.length)];
                    petalos.push(new Petalo(
                        flor_random.x + Math.random() * 80 - 40,
                        flor_random.y,
                        true,
                        todosPuntos[idx],
                        true
                    ));
                }
            }
        }
    }

    if (!estado.nombre &&!estado.pre_nombre) {
        petalos = petalos.filter(p =>!p.formando_nombre);
    }

    let alpha = 1;
    if (tiempo_en_frase < 0.5) alpha = tiempo_en_frase / 0.5;
    else if (tiempo_en_frase > estado.duracion - 0.5) alpha = (estado.duracion - tiempo_en_frase) / 0.5;

    ctx.globalAlpha = alpha;

    if (!estado.nombre) {
        const frasesTexto = [
            [
                `Han pasado ${diaDelAno} días del año con ${ahora.getHours()} horas`,
                `con ${ahora.getMinutes()} minutos y ${ahora.getSeconds()} segundos`,
                "agradezco por tener una amiga como tú, que sabes escuchar,",
                "la que hace que mis días malos sean menos pesados con tu humor."
            ],
            ["Eres mi personita favorita, la más linda ante mis ojos,",
             "la más perfecta, única y diferente al resto."],
            ["Eres incomparable, no te comparas a ninguna.",
             "Me encanta tu forma de ser y como vez el mundo."],
            ["Eres hermosa como las estrellas, solo que las estrellas",
             "te envidian porque tú eres más hermosa que ellas"],
            ["Brillas más que todo el universo junto."],
            ["TE QUIERO MUCHO"]
        ];
        const duraciones = [12, 8, 8, 9, 5, 4];
        let tiempo_total = (Date.now() - tiempoInicio) / 1000;
        let duracion_total = duraciones.reduce((a,b)=>a+b, 0) + 7;
        let tiempo_ciclo = tiempo_total % duracion_total;
        let idx = 0, temp = 0;
        for (let i = 0; i < duraciones.length; i++) {
            temp += duraciones[i];
            if (tiempo_ciclo < temp) { idx = i; break; }
        }

        ctx.font = 'bold 28px Arial';
        let y_pos = 100;
        frasesTexto[idx].forEach(linea => {
            ctx.fillStyle = 'rgb(20, 15, 30)';
            ctx.fillText(linea, 42, y_pos + 2);
            ctx.fillStyle = BLANCO;
            ctx.fillText(linea, 40, y_pos);
            y_pos += 35;
        });
    }
    ctx.globalAlpha = 1;
}

// Inicializar
for (let i = 0; i < 60; i++) {
    estrellas.push(new Estrella(Math.random() * ANCHO, Math.random() * 280));
}
for (let i = 0; i < 250; i++) {
    let ang = (Math.random() * 170 - 175) * Math.PI / 180;
    let dist = Math.random() * 145 + 25;
    let fx = tronco_x + Math.cos(ang) * dist - 12;
    let fy = tronco_y - 150 + Math.sin(ang) * dist;
    flores.push(new FlorSakura(fx, fy));
}

document.getElementById('info').style.display = 'none';

function animar() {
    let t = Date.now();
    dibujarAtardecer();
    estrellas.forEach(e => e.dibujar(t));
    dibujarCesped(t);
    dibujarArbol(tronco_x, tronco_y);
    flores.forEach(f => f.dibujar(t));

    if (Math.random() < 0.5) {
        let flor_random = flores[Math.floor(Math.random() * flores.length)];
        petalos.push(new Petalo(flor_random.x, flor_random.y));
    }

    petalos = petalos.filter(petalo => {
        petalo.mover();
        petalo.dibujar();
        return!(petalo.y > ALTO - 70 &&!petalo.objetivo &&!petalo.formando_nombre);
    });

    dibujarTextos();
    requestAnimationFrame(animar);
}

animar();
</script>
</body>
  </html>
